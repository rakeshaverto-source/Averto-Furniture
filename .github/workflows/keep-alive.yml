# Supabase's free plan pauses a project after 7 days without activity.
# This pings the database every 3 days so it stays awake during development.
# Needs a repo secret SUPABASE_DB_URL = the session-mode (port 5432) connection string.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 */3 * *" # 03:00 UTC every third day
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a tiny query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -c "select 1;"
